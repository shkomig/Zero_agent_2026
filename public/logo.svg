<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d2626"/>
      <stop offset="100%" stop-color="#060f0f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.25"/>

  <!-- Z shape -->
  <g filter="url(#glow)">
    <polyline points="52,58 148,58 52,142 148,142"
      fill="none" stroke="#2dd4bf" stroke-width="13"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Corner dots -->
  <circle cx="52"  cy="58"  r="7" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="148" cy="58"  r="7" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="52"  cy="142" r="7" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="148" cy="142" r="7" fill="#2dd4bf" opacity="0.9"/>

  <!-- Small circuit nodes on the Z diagonal -->
  <circle cx="100" cy="100" r="4" fill="#2dd4bf" opacity="0.6"/>
</svg>
